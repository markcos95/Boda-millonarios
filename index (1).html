<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boda de los Millonarios 3D</title><style>body{margin:0;background:#100e20;color:#ffe1a0;font:15px system-ui}canvas{display:block;width:100%;height:65dvh}header{text-align:center;padding:8px}h2{margin:0;font: bold 22px Georgia}section{padding:10px}input,button{background:#292039;color:#ffe1a0;border:1px solid #aa8951;border-radius:8px;padding:12px;font-size:15px}input{width:90%}#buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}#stage{position:relative}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}#labels span{position:absolute;transform:translate(-50%,-100%);background:#100e20cc;padding:3px;border-radius:4px;font-size:11px;white-space:nowrap}</style><header><h2>La Boda de los Millonarios</h2>@animedud213 · Noche de lujo · DEMO</header><div id="stage"><div id="labels"></div></div><section><div id="status">Esperando invitados</div><input id="name" value="Invitado VIP" maxlength="24"><div id="buttons"></div><button id="full">Pantalla completa</button> <button id="reset">Reiniciar</button><p id="rank"></p></section><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const stage=document.querySelector('#stage'),labels=document.querySelector('#labels'),status=document.querySelector('#status'),scene=new T.Scene();scene.background=new T.Color(0x080c26);scene.fog=new T.FogExp2(0x080c26,.025);const camera=new T.PerspectiveCamera(48,1,.1,100);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));stage.prepend(r.domElement);scene.add(new T.HemisphereLight(0xb8caff,0x63513a,2));const light=new T.DirectionalLight(0xffdca0,3);light.position.set(4,10,5);scene.add(light);
function mesh(g,c,parent,x,y,z){const m=new T.Mesh(g,new T.MeshStandardMaterial({color:c,roughness:.65}));m.position.set(x,y,z);parent.add(m);return m}function box(w,h,d,c,x,y,z,p=scene){return mesh(new T.BoxGeometry(w,h,d),c,p,x,y,z)}function ball(rad,c,p,x,y,z){return mesh(new T.SphereGeometry(rad,12,8),c,p,x,y,z)}
box(50,.3,50,0x263d35,0,-.2,0);box(17,5,5,0xd1b78c,0,2.5,-9);box(7,7,6,0xe3cba0,0,3.5,-9);for(let i=-8;i<=8;i+=2){mesh(new T.CylinderGeometry(.22,.28,5.5,12),0xffdfaa,scene,i,2.75,-6.2);box(.9,1.8,.1,0xffc75c,i,3.2,-6.4)}box(2.8,3.7,.2,0x67422b,0,1.85,-5.9);box(3,.03,13,0x9b1538,0,.02,1);box(5,.12,8,0x177fa5,-6,.02,1);for(let i=0;i<6;i++)for(let j=0;j<6;j++)box(.85,.05,.85,(i+j)%2?0x8d477e:0x385d91,3+i*.9,.04,-2+j*.9);for(let i=-8;i<=8;i+=2){box(.12,2,.12,0xc6a15c,i,1,5);ball(.18,0xffdc83,scene,i,2,5)}
const people=[],scores=new Map(),sparks=[],cars=[];function person(name,dress,x,z,permanent=false){const g=new T.Group();scene.add(g);g.position.set(x,0,z);let skin=0xd7a17e;ball(.22,skin,g,0,1.65,0);ball(.225,0x33221d,g,0,1.76,-.035).scale.set(1,.55,1);if(dress){mesh(new T.CylinderGeometry(.19,.48,.85,16),permanent?0xfff5ee:0xb33778,g,0,.65,0);box(.39,.48,.27,permanent?0xfff5ee:0xb33778,0,1.15,0,g)}else{box(.48,.65,.29,0x202335,0,1.12,0,g);box(.14,.38,.03,0xffffff,0,1.22,.16,g);for(let a of [-.13,.13])box(.18,.66,.19,0x171b27,a,.4,0,g)}let arms=[];for(let a of [-1,1]){let arm=new T.Group();g.add(arm);arm.position.set(a*.29,1.35,0);box(.14,.48,.15,dress?skin:0x202335,0,-.22,0,arm);arms.push(arm)}let label=document.createElement('span');label.textContent=name;labels.append(label);let p={g,arms,label,name,permanent,tx:x,tz:z,phase:Math.random()*6};people.push(p);return p}person('Novio',false,-.6,-3,true);person('Novia',true,.6,-3,true);
function fireworks(){for(let i=0;i<65;i++){let m=ball(.045,[0xffcf55,0xff75cb,0x8ecbff][i%3],scene,0,6,-4);sparks.push({m,v:new T.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5),life:2})}}
function car(){let g=new T.Group();scene.add(g);box(1.2,.45,2.4,0xc62b39,0,.45,0,g);box(.95,.38,1.1,0x283e55,0,.85,-.15,g);for(let a of [-.6,.6])for(let b of [-.75,.75])ball(.25,0x111111,g,a,.27,b);g.position.set(-3,0,12);cars.push(g)}
function gift(n){let name=document.querySelector('#name').value.trim()||'Invitado';scores.set(name,(scores.get(name)||0)+n);if(!people.some(p=>!p.permanent&&p.name===name)&&people.length<42){let p=person(name,Math.random()>.5,0,8);p.tx=2+Math.random()*5;p.tz=-2+Math.random()*6}if(n>=5000)fireworks();if(n>=10000)car();status.textContent=name+' · '+n.toLocaleString()+' monedas simuladas';document.querySelector('#rank').textContent='Patrocinadores: '+[...scores].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([s,v])=>s+' '+v).join(' | ')}for(let n of [100,500,1000,5000,10000,30000]){let b=document.createElement('button');b.textContent=n.toLocaleString()+' 🪙';b.onclick=()=>gift(n);document.querySelector('#buttons').append(b)}document.querySelector('#reset').onclick=()=>location.reload();document.querySelector('#full').onclick=()=>{if(stage.requestFullscreen)stage.requestFullscreen().catch(()=>status.textContent='Pantalla completa no disponible')};function resize(){let w=stage.clientWidth,h=r.domElement.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();r.setSize(w,h,false)}new ResizeObserver(resize).observe(stage);resize();let clock=new T.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;camera.position.set(Math.sin(t*.12)*3,8,15);camera.lookAt(0,1,-1);for(let p of people){p.g.position.x+=(p.tx-p.g.position.x)*dt;p.g.position.z+=(p.tz-p.g.position.z)*dt;p.g.rotation.y=Math.sin(t*2+p.phase)*.45;p.g.position.y=Math.abs(Math.sin(t*4+p.phase))*.08;p.arms.forEach((a,i)=>a.rotation.z=Math.sin(t*4+p.phase+i)*.65);let v=p.g.position.clone().add(new T.Vector3(0,2.05,0)).project(camera);p.label.style.left=(v.x*.5+.5)*100+'%';p.label.style.top=(-v.y*.5+.5)*100+'%';p.label.style.display=v.z>1?'none':'block'}for(let s of sparks){s.m.position.addScaledVector(s.v,dt);s.v.y-=dt*3;s.life-=dt;if(s.life<=0)scene.remove(s.m)}for(let i=sparks.length-1;i>=0;i--)if(sparks[i].life<=0)sparks.splice(i,1);for(let g of cars)g.position.z=Math.max(3,g.position.z-dt*2);r.render(scene,camera)}loop();
</script></html>
